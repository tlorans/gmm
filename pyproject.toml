[project]
name = "gmm"
version = "0.1.0"
description = "Reproduction of the Lecture Notes for Empirical Finance as a Quarto book"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
